- key: openSpectro
  title: "OpenSpectro: An Open-Source Spectroscopic Profiling Platform"
  role: "Lead · Doctoral Researcher"
  venue: "Watson Research Lab, University of Virginia"
  period: "2024 – Present"
  category: Research
  image: openSpectro.png
  desc: >-
    A modular, open-source platform that acquires, visualizes, and optimizes spectroscopic
