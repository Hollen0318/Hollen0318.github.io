- key: optiLact
  title: "OptiLact: Wearable Lactate Monitoring during Exercise"
  role: "Lead · Doctoral Researcher"
  venue: "Watson Research Lab, University of Virginia"
  period: "2025 – Present"
  category: Research
  image: optiLact.svg
  desc: >-
    A wearable broad-band optical spectroscopy system for noninvasive lactate estimation during
    exercise. It captures broadband optical signals across lactate-sensitive bands and applies a
    two-stage hierarchical regression — a PLS model for the per-session trend and an ElasticNet
    model for the absolute level. Validated in vitro and in an in-vivo cycling study (11
    participants, VO₂max protocols), reaching R² ≈ 0.62. Paper under review.
  links:
    - { label: "Code", url: "https://github.com/Hollen0318/OptiLact" }

