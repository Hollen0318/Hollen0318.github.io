<header class="site-nav">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.author.short_name }}</a>

    <nav class="nav-links" aria-label="Primary">
      {%- assign u = page.url -%}
      <a href="{{ '/' | relative_url }}" {% if u == '/' %}class="active" aria-current="page"{% endif %}>About</a>
      <a href="{{ '/publications/' | relative_url }}" {% if u contains '/publications' %}class="active" aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/projects/' | relative_url }}" {% if u contains '/projects' %}class="active" aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/service/' | relative_url }}" {% if u contains '/service' %}class="active" aria-current="page"{% endif %}>Service &amp; Awards</a>
      {%- if site.author.cv and site.author.cv != "" -%}
      <a href="{{ site.author.cv | relative_url }}" target="_blank" rel="noopener">CV</a>
      {%- endif -%}
    </nav>

    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
</header>
